# GPU 서버 전용 - Dockerfile/소스코드 없이, Docker Hub에서 이미지만 받아서 실행하는 버전.
# 이 파일 + mysql-init/solar_backup.sql 두 개만 GPU 서버로 옮기면 된다.
#
# 사용법 (GPU 서버에서):
#   docker login
#   docker compose -f docker-compose.gpu.yml up -d
#
# 앱을 새 버전으로 업데이트할 때:
#   docker compose -f docker-compose.gpu.yml pull solar
#   docker compose -f docker-compose.gpu.yml up -d

services:
  mysql:
    image: mysql:8.0  # Docker Hub 공식 이미지 - 자동으로 pull됨
    container_name: solar-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root@0000
      - MYSQL_DATABASE=solar
    volumes:
      - mysql-data:/var/lib/mysql
      # 이 폴더 안의 .sql 파일은 "데이터가 하나도 없는 최초 실행"에만 자동으로 실행됨(=복원 1회용)
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    restart: unless-stopped

  solar:
    image: deuk94/solar:latest
    container_name: solar-app
    depends_on:
      - mysql
    ports:
      - "80:8080"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/solar
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root@0000
      # inference_server.py는 컨테이너가 아니라 이 GPU 호스트에서 직접 도는 파이썬 스크립트라,
      # 컨테이너 안에서는 host.docker.internal로 호스트를 가리켜야 한다.
      - PANEL_ANNOTATED_STREAM_URL=http://host.docker.internal:8091/
      # 기상청 API 키 - 저장소에 평문으로 두지 않고 .env(gitignore 대상, .env.example 참고)에서 주입
      - KMA_API_KEY=${KMA_API_KEY:-}
    restart: unless-stopped

volumes:
  mysql-data:
