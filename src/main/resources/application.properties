spring.application.name=solar

# 로컬 전용 설정 오버라이드 - application-local.properties가 있으면 자동으로 읽어서 병합됨
spring.config.import=optional:application-local.properties

# mysql 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/solar
spring.datasource.username=root
spring.datasource.password=root@0000

# jpa 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=mysql

# 파일 업로드 설정
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB
file.upload-dir=uploads/notice
panel.upload-dir=uploads/panel

# 라즈베리파이 mjpg-streamer 원본 주소
panel.stream-url=http://100.75.114.8:8090/?action=stream

# GPU 데스크탑에서 도는 ai/inference_server.py의 박스 오버레이 영상 주소
panel.annotated-stream-url=http://100.82.175.26:8091/

# MJPEG 스트림 프록시가 톰캣 기본 async 타임아웃(30초)에 끊기지 않도록 무제한 설정
spring.mvc.async.request-timeout=-1

# 센서 데이터 수집 API 키
sensor.api-key=solar-sensor-key-2026

# 센서 이상 알림 임계값
sensor.threshold.current-min=0.0
sensor.threshold.current-max=10.0
sensor.threshold.voltage-min=180.0
sensor.threshold.voltage-max=260.0

# 같은 유형의 알림은 이 시간(분) 이내에 재발생해도 무시(도배 방지)
sensor.alert.cooldown-minutes=5

# AI 자동 세척 요청 쿨다운(분) - 세척 완료 직후 재감지돼도 이 시간 동안은 재요청 안 함
cleaning.auto-request-cooldown-minutes=0

# 기상청 공공데이터포털(data.go.kr) API 키 - 단기예보/중기예보 공통
kma.api-key=${KMA_API_KEY:}

# 단기예보(getVilageFcst) 조회 격자좌표 - 진주 (LCC DFS 변환식으로 계산, 진주시청 좌표 기준)
kma.nx=82
kma.ny=77

# 중기예보(getMidLandFcst/getMidTa) 조회 구역코드
kma.mid-land-reg-id=11B00000
kma.mid-ta-reg-id=11B10101
