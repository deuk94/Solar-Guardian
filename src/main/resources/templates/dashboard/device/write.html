<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 기기 등록 - Solar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container-md">
    <div class="card">
        <h2 class="card-title">새 기기 등록</h2>

        <form th:action="@{/dashboard/device/new}" th:object="${deviceWriteDto}" method="post">
            <div class="form-group">
                <label for="deviceName">기기명 <span class="required">*</span></label>
                <input type="text" id="deviceName" th:field="*{deviceName}" class="form-control" placeholder="예: Solar-Cleaner AI">
                <span th:if="${#fields.hasErrors('deviceName')}" th:errors="*{deviceName}" class="field-error"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="serialNo">시리얼 번호 <span class="required">*</span></label>
                    <input type="text" id="serialNo" th:field="*{serialNo}" class="form-control" placeholder="예: CBI-2604-0001">
                    <span th:if="${#fields.hasErrors('serialNo')}" th:errors="*{serialNo}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label for="firmwareVersion">펌웨어 버전 <span class="required">*</span></label>
                    <input type="text" id="firmwareVersion" th:field="*{firmwareVersion}" class="form-control" placeholder="예: v1.1.3">
                    <span th:if="${#fields.hasErrors('firmwareVersion')}" th:errors="*{firmwareVersion}" class="field-error"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="modelName">모델명 <span class="required">*</span></label>
                    <input type="text" id="modelName" th:field="*{modelName}" class="form-control" placeholder="예: clean_bot_1">
                    <span th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label for="manufacturedDate">제조일 <span class="required">*</span></label>
                    <input type="date" id="manufacturedDate" th:field="*{manufacturedDate}" class="form-control">
                    <span th:if="${#fields.hasErrors('manufacturedDate')}" th:errors="*{manufacturedDate}" class="field-error"></span>
                </div>
            </div>

            <div class="action-bar">
                <button type="submit" class="btn btn-primary">등록</button>
                <a th:href="@{/dashboard/device}" class="btn btn-outline">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
