<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 등록 - Solar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container-md">
    <div class="card">
        <h2 class="card-title">공지사항 등록</h2>

        <form th:action="@{/notice/write}" th:object="${noticeWriteDto}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">제목 <span class="required">*</span></label>
                <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="제목을 입력하세요">
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="content">내용 <span class="required">*</span></label>
                <textarea id="content" th:field="*{content}" class="form-control" rows="10" placeholder="내용을 입력하세요"></textarea>
                <span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="field-error"></span>
            </div>

            <div class="form-group">
                <label for="files">첨부파일</label>
                <input type="file" id="files" name="files" class="form-control" multiple>
            </div>

            <div class="action-bar">
                <button type="submit" class="btn btn-primary">등록</button>
                <a th:href="@{/notice/list}" class="btn btn-outline">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
