<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정 - Solar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container-md">
    <div class="page-header">
        <h2 class="page-title">게시글 수정</h2>
    </div>

    <div class="card">
        <form th:action="@{/board/{id}/edit(id=${boardId})}" method="post" th:object="${boardUpdateDto}">
            <div class="form-group">
                <label for="title">제목 <span class="required">*</span></label>
                <input type="text" id="title" class="form-control" th:field="*{title}">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="form-group">
                <label for="content">내용 <span class="required">*</span></label>
                <textarea id="content" class="form-control" th:field="*{content}" rows="12"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
            </div>
            <div class="action-bar-split">
                <button type="submit" class="btn btn-primary">저장</button>
                <a th:href="@{/board/{id}(id=${boardId})}" class="btn btn-outline">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
